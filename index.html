<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador Nitro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .loader {
      border-top-color: #10b981;
      animation: spinner 1.5s linear infinite;
    }
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-[#0f172a] font-sans min-h-screen text-slate-200">

  <div class="max-w-xl mx-auto pt-12 px-4 pb-6">
    
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-white tracking-wide flex justify-center items-center gap-2">
        🚀 Buscador de Órdenes Nitro
      </h1>
      <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">CONSULTA ID DESDE NITRO</p>
      <button onclick="alternarVistaHielo()" id="btnVistaHielo"
              class="mt-4 bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-300 border border-cyan-500/40 px-4 py-2 rounded-xl text-xs font-bold tracking-wide transition-all active:scale-95 shadow-sm">
        🧊 Órdenes de Hielo
      </button>
    </div>

    <!-- VISTA ORDENES DE HIELO -->
    <div id="vistaHielo" class="hidden">
      <div class="bg-[#1e293b] p-6 rounded-2xl shadow-xl border border-cyan-800/60 mb-6">
        <div class="flex justify-between items-center mb-3">
          <label for="selTiendaHielo" class="text-xs font-bold uppercase tracking-wider text-cyan-400">Selecciona tu tienda</label>
          <button onclick="cargarOrdenesHielo(true)" id="btnRefrescarHielo"
                  class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/40 px-3 py-1 rounded-lg text-[11px] font-bold tracking-wide transition-all active:scale-95 shadow-sm">
            🔄 Actualizar
          </button>
        </div>
        <select id="selTiendaHielo" onchange="elegirTiendaHielo()" disabled
                class="w-full px-4 py-3 bg-[#0f172a] border border-slate-600 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none font-medium text-white">
          <option value="">Cargando tiendas...</option>
        </select>
        <label for="selProveedorHielo" class="block text-xs font-bold uppercase tracking-wider text-cyan-400 mt-4 mb-3">Selecciona el proveedor</label>
        <select id="selProveedorHielo" onchange="mostrarOrdenesHielo()" disabled
                class="w-full px-4 py-3 bg-[#0f172a] border border-slate-600 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none font-medium text-white disabled:opacity-50">
          <option value="">Primero elige tu tienda</option>
        </select>
        <p class="text-[11px] text-slate-400 mt-3">Se muestran las 2 órdenes abiertas más antiguas de la tienda para ese proveedor. <span class="text-cyan-300 font-semibold">Ingresa el hielo primero en la #1.</span></p>
        <p id="lblActualizadoHielo" class="text-[10px] text-slate-500 mt-1"></p>
      </div>
      <div id="divLoadingHielo" class="hidden text-center py-8">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-700 h-10 w-10 mx-auto mb-3"></div>
        <p class="text-xs font-medium text-slate-400 tracking-wide">Consultando órdenes de hielo...</p>
      </div>
      <div id="divErrorHielo" class="hidden bg-red-950/40 border border-red-800/60 p-4 rounded-xl text-red-400 text-sm font-medium mb-6 text-center shadow-lg"></div>
      <div id="contenedorHielo" class="flex flex-col gap-6"></div>
    </div>

    <!-- VISTA BUSCADOR -->
    <div id="vistaBuscador">

    <!-- Panel Buscador con Botón de Actualizar Data -->
    <div class="bg-[#1e293b] p-6 rounded-2xl shadow-xl border border-slate-700 mb-6">
      <div class="flex flex-col gap-3">
        <div class="flex justify-between items-center">
          <label for="txtExternalId" class="text-xs font-bold uppercase tracking-wider text-blue-400">Ingresar Numero de Albaran u Orden de Compra</label>
          
          <!-- BOTÓN DE ACTUALIZAR DATA -->
          <button onclick="actualizarDataQueries()" id="btnActualizarData"
                  class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/40 px-3 py-1 rounded-lg text-[11px] font-bold tracking-wide transition-all active:scale-95 flex items-center gap-1.5 shadow-sm">
            <span id="iconActualizar">🔄</span> <span id="txtActualizar">Actualizar Data</span>
          </button>
        </div>

        <div class="flex gap-2">
          <input type="text" id="txtExternalId" placeholder="Ej: 14212974" 
                 class="flex-1 px-4 py-3 bg-[#0f172a] border border-slate-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-medium text-white placeholder-slate-500">
          <button onclick="ejecutarBusqueda(false)" id="btnBuscar"
                  class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center">
            Buscar
          </button>
        </div>
      </div>
    </div>

    <!-- Estado de Carga -->
    <div id="divLoading" class="hidden text-center py-8">
      <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-700 h-10 w-10 mx-auto mb-3"></div>
      <p id="lblLoadingText" class="text-xs font-medium text-slate-400 tracking-wide">Buscando coincidencias en la base de datos...</p>
    </div>

    <!-- Mensaje de Éxito de Refresco -->
    <div id="divExito" class="hidden bg-emerald-950/40 border border-emerald-800/60 p-3 rounded-xl text-emerald-400 text-xs font-medium mb-6 text-center shadow-lg"></div>

    <!-- Alerta de Error -->
    <div id="divError" class="hidden bg-red-950/40 border border-red-800/60 p-4 rounded-xl text-red-400 text-sm font-medium mb-6 text-center shadow-lg"></div>

    <div id="lblContador" class="hidden text-xs text-slate-400 font-bold uppercase tracking-wider mb-3 px-1"></div>

    <div id="contenedorResultados" class="flex flex-col gap-6"></div>
    </div>

  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyar0C3avos5tH4S5lte-Bjc00aAhp0dnqE0X2YIXPPOdolUEZrvJylodQ9q_cJC7Vhaw/exec";
    // Ordenes de hielo: endpoint del backend de Control Hielo Chedraui (kevinsilva-rgb/Control-Hielo-Chedraui,
    // doGet ?api=ordenesHielo, query Redash 138487) — proveedor Turbo TIENDAS CHEDRAUI, abiertas = SENT/AT_STORE,
    // por tienda y proveedor (marca Hielo Club / Hielo Fiesta / Iglu), las 2 mas antiguas.
    const HIELO_API_URL = "https://script.google.com/macros/s/AKfycbxUy3nlvDOEHp20OzHcYJAH2N7f9El1eRjWl3lfVvNMJDw3EYRyz0E6j0dtKtDhHHjY/exec?api=ordenesHielo";
    var datosHielo = null;

    document.getElementById('txtExternalId').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') ejecutarBusqueda(false);
    });

    function actualizarDataQueries() {
      var btn = document.getElementById('btnActualizarData');
      var txt = document.getElementById('txtActualizar');
      var icon = document.getElementById('iconActualizar');
      
      btn.disabled = true;
      btn.classList.add('opacity-50');
      txt.innerText = "Actualizando Redash...";
      icon.classList.add('animate-spin');
      
      ejecutarBusqueda(true);
    }

    function ejecutarBusqueda(forzarRefresco) {
      var idInput = document.getElementById('txtExternalId').value.trim();
      
      document.getElementById('divError').classList.add('hidden');
      document.getElementById('divExito').classList.add('hidden');
      document.getElementById('lblContador').classList.add('hidden');
      document.getElementById('contenedorResultados').innerHTML = '';
      
      if (!idInput && !forzarRefresco) {
        mostrarError("Por favor, ingresa un término de búsqueda.");
        restablecerBotonActualizar();
        return;
      }
      
      var loadingText = document.getElementById('lblLoadingText');
      loadingText.innerText = forzarRefresco 
        ? "Forzando actualización de los queries en Redash..." 
        : "Buscando coincidencias en la base de datos...";
      
      document.getElementById('divLoading').classList.remove('hidden');
      
      fetch(`${WEB_APP_URL}?externalId=${encodeURIComponent(idInput)}&refrescar=${forzarRefresco}`)
        .then(response => response.json())
        .then(response => {
          document.getElementById('divLoading').classList.add('hidden');
          restablecerBotonActualizar();

          if (response.error) {
            mostrarError(response.mensaje);
          } else {
            if (response.mensajeRefresco) {
              var divExito = document.getElementById('divExito');
              divExito.innerText = "✓ " + response.mensajeRefresco;
              divExito.classList.remove('hidden');
            }
            if (response.data && response.data.length > 0) {
              mostrarMultiplesDatos(response.data);
            }
          }
        })
        .catch(err => {
          document.getElementById('divLoading').classList.add('hidden');
          restablecerBotonActualizar();
          mostrarError("Error al conectar con el servidor de la API de Redash.");
          console.error(err);
        });
    }

    function restablecerBotonActualizar() {
      var btn = document.getElementById('btnActualizarData');
      var txt = document.getElementById('txtActualizar');
      var icon = document.getElementById('iconActualizar');
      
      btn.disabled = false;
      btn.classList.remove('opacity-50');
      txt.innerText = "Actualizar Data";
      icon.classList.remove('animate-spin');
    }

    function mostrarError(msg) {
      var div = document.getElementById('divError');
      div.innerHTML = `
        <div class="font-bold mb-1">⚠️ ${msg}</div>
        <div class="text-xs opacity-80 mt-2 border-t border-red-800/40 pt-2 font-normal">
          Por favor, <span class="font-semibold underline">vuelve a intentar la búsqueda</span>.<br>
          Si el error persiste, comunícate de inmediato con la <span class="font-semibold text-white">Torre de Control</span>.
        </div>
      `;
      div.classList.remove('hidden');
    }

    function mostrarMultiplesDatos(listaOrdenes) {
      var contenedor = document.getElementById('contenedorResultados');
      var contador = document.getElementById('lblContador');
      
      contador.innerText = `Registros encontrados: ${listaOrdenes.length}`;
      contador.classList.remove('hidden');

      listaOrdenes.forEach(function(data, index) {
        var estadoTxt = data.estadoPo.toString().toUpperCase();
        var esTransf = data.esTransferencia === true;

        var estadoClases = "bg-amber-500/10 text-amber-400 border border-amber-500/30";
        // ZERO_DELIVERY contiene "DELIVERY": se evalua antes que la regla verde para que no salga como exito
        if (estadoTxt.includes("CANCEL") || estadoTxt.includes("ZERO")) {
          estadoClases = "bg-red-500/10 text-red-400 border border-red-500/30";
        } else if (estadoTxt.includes("SENT") || estadoTxt.includes("DELIVERY") || estadoTxt.includes("COMPLETED")) {
          estadoClases = "bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
        }

        var cantRecibidaLimpia = data.cantidadRecibida;
        if (!cantRecibidaLimpia || cantRecibidaLimpia.toString().trim().toUpperCase() === "N/A" || cantRecibidaLimpia.toString().trim() === "") {
          cantRecibidaLimpia = "0";
        }

        var fechaTxt = data.fechaCreacionMx || "N/A";
        if (fechaTxt !== "N/A" && fechaTxt.includes(" ")) {
          fechaTxt = fechaTxt.split(" ")[0];
        }

        var bordeTarjeta = esTransf ? "border-rose-600/80 shadow-rose-950/20" : "border-slate-700";
        var tituloColor = esTransf ? "text-rose-400" : "text-blue-400";
        var idNitroColor = esTransf ? "text-rose-400 drop-shadow-[0_0_6px_rgba(244,63,94,0.3)]" : "text-emerald-400 drop-shadow-[0_0_6px_rgba(16,185,129,0.2)]";
        
        var labelSuperior = esTransf ? "ID" : "EXTERNAL ID";
        var labelSecundario = esTransf ? "SAP ID" : "ID NITRO (PO_ID)";
        var valorSecundario = esTransf ? (data.sapId || "N/A") : data.idNitro;
        
        var badgeTransferencia = esTransf 
          ? `<span class="bg-rose-500/20 text-rose-300 border border-rose-500/50 px-2 py-0.5 rounded text-[9px] font-extrabold uppercase tracking-widest flex items-center gap-1">🔄 Transferencia</span>` 
          : '';

        var botonCopiarSuperior = esTransf ? `
          <button onclick="copiarIdNitroCualquiera('${data.externalId}', 'btnCopiarTop_${index}', 'txtCopiarTop_${index}')" id="btnCopiarTop_${index}" 
                  class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-2.5 py-1 rounded-lg border border-slate-600 text-[11px] font-semibold tracking-wide transition-all active:scale-95 flex items-center gap-1">
            <span id="txtCopiarTop_${index}">Copiar ID</span>
          </button>
        ` : '';

        var htmlTarjeta = `
          <div class="bg-[#1e293b] rounded-2xl shadow-2xl border ${bordeTarjeta} overflow-hidden transition-all">
            <div class="bg-[#0f172a] px-6 py-4 border-b border-slate-700/80 flex justify-between items-center">
              <div>
                <div class="flex items-center gap-2 mb-0.5">
                  <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">${labelSuperior}</span>
                  ${badgeTransferencia}
                </div>
                <div class="flex items-center gap-3">
                  <h2 class="text-lg font-bold font-mono ${tituloColor}">${data.externalId}</h2>
                  ${botonCopiarSuperior}
                </div>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-mono text-slate-400 bg-slate-800/60 px-2 py-1 rounded border border-slate-700/60 font-semibold">${fechaTxt}</span>
                <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${estadoClases}">${estadoTxt}</span>
              </div>
            </div>
            
            <div class="p-6 grid grid-cols-1 gap-5">
              <div class="border-b border-slate-700/60 pb-3 flex justify-between items-end">
                <div>
                  <span class="text-[10px] font-semibold ${esTransf ? 'text-rose-400' : 'text-emerald-400'} block uppercase tracking-wider">${labelSecundario}</span>
                  <span id="resIdNitro_${index}" class="text-lg font-extrabold ${idNitroColor} font-mono tracking-wide">${valorSecundario}</span>
                </div>
                <button onclick="copiarIdNitroCualquiera('${valorSecundario}', 'btnCopiar_${index}', 'txtCopiar_${index}')" id="btnCopiar_${index}" 
                        class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-3 py-1.5 rounded-lg border border-slate-600 text-xs font-semibold tracking-wide transition-all active:scale-95 flex items-center gap-1.5">
                  <span id="txtCopiar_${index}">${esTransf ? 'Copiar SAP' : 'Copiar'}</span>
                </button>
              </div>

              <div class="border-b border-slate-700/60 pb-3">
                <span class="text-[10px] font-semibold text-slate-400 block uppercase tracking-wider">Tienda Destino</span>
                <span class="text-base font-bold text-white">${data.tienda}</span>
              </div>
              
              <div class="grid grid-cols-2 gap-4 pt-1">
                <div class="bg-[#0f172a]/60 p-4 rounded-xl border ${esTransf ? 'border-rose-900/30' : 'border-blue-900/30'}">
                  <span class="text-[10px] font-semibold ${esTransf ? 'text-rose-400' : 'text-blue-400'} block uppercase tracking-wider">Cant. Solicitada</span>
                  <span class="text-xl font-extrabold ${esTransf ? 'text-rose-300' : 'text-blue-300'}">${data.cantidadSolicitada}</span>
                </div>
                <div class="bg-[#0f172a]/60 p-4 rounded-xl border ${esTransf ? 'border-rose-900/30' : 'border-emerald-900/30'}">
                  <span class="text-[10px] font-semibold ${esTransf ? 'text-rose-400' : 'text-emerald-400'} block uppercase tracking-wider">Cant. Recibida</span>
                  <span class="text-xl font-extrabold ${esTransf ? 'text-rose-300' : 'text-emerald-300'}">${cantRecibidaLimpia}</span>
                </div>
              </div>
            </div>
          </div>
        `;
        
        contenedor.innerHTML += htmlTarjeta;
      });
    }

    function escaparHtml(v) {
      return (v === null || v === undefined ? '' : v.toString())
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function alternarVistaHielo() {
      var vistaHielo = document.getElementById('vistaHielo');
      var mostrarHielo = vistaHielo.classList.contains('hidden');
      vistaHielo.classList.toggle('hidden', !mostrarHielo);
      document.getElementById('vistaBuscador').classList.toggle('hidden', mostrarHielo);
      document.getElementById('btnVistaHielo').innerText = mostrarHielo ? '🔎 Volver al buscador de IDs' : '🧊 Órdenes de Hielo';
      if (mostrarHielo && !datosHielo) cargarOrdenesHielo(false);
    }

    function textoAbiertas(n) {
      return n ? n + (n === 1 ? ' abierta' : ' abiertas') : 'sin órdenes abiertas';
    }

    function cargarOrdenesHielo(forzarRefresco) {
      var sel = document.getElementById('selTiendaHielo');
      var selProv = document.getElementById('selProveedorHielo');
      var btn = document.getElementById('btnRefrescarHielo');
      // Recordar la seleccion por nombre para restaurarla despues de Actualizar
      var tiendaPrevia = sel.value !== '' && datosHielo ? datosHielo[Number(sel.value)].tienda : null;
      var provPrevio = selProv.value !== '' && tiendaPrevia ? datosHielo[Number(sel.value)].proveedores[Number(selProv.value)].proveedor : null;
      document.getElementById('divErrorHielo').classList.add('hidden');
      document.getElementById('contenedorHielo').innerHTML = '';
      document.getElementById('divLoadingHielo').classList.remove('hidden');
      btn.disabled = true;
      btn.classList.add('opacity-50');

      fetch(HIELO_API_URL + '&refrescar=' + forzarRefresco)
        .then(function (r) { return r.json(); })
        .then(function (resp) {
          if (resp.error) throw new Error(resp.mensaje);
          datosHielo = resp.tiendas;
          sel.innerHTML = '<option value="">— Elige una tienda —</option>' + datosHielo.map(function (t, i) {
            var total = t.proveedores.reduce(function (acc, p) { return acc + p.totalAbiertas; }, 0);
            return '<option value="' + i + '">' + escaparHtml(t.tienda + ' (' + textoAbiertas(total) + ')') + '</option>';
          }).join('');
          sel.disabled = false;
          var idx = datosHielo.findIndex(function (t) { return t.tienda === tiendaPrevia; });
          sel.value = idx >= 0 ? idx : '';
          elegirTiendaHielo(provPrevio);
          document.getElementById('lblActualizadoHielo').innerText = 'Datos al ' + resp.actualizado;
        })
        .catch(function (err) {
          console.error(err);
          var div = document.getElementById('divErrorHielo');
          div.innerHTML = '<div class="font-bold mb-1">⚠️ No se pudieron cargar las órdenes de hielo.</div>' +
            '<div class="text-xs opacity-80 mt-2 border-t border-red-800/40 pt-2 font-normal">Vuelve a intentar con <span class="font-semibold underline">🔄 Actualizar</span>. Si el error persiste, comunícate con la <span class="font-semibold text-white">Torre de Control</span>.</div>';
          div.classList.remove('hidden');
        })
        .finally(function () {
          document.getElementById('divLoadingHielo').classList.add('hidden');
          btn.disabled = false;
          btn.classList.remove('opacity-50');
        });
    }

    function elegirTiendaHielo(provPrevio) {
      var sel = document.getElementById('selTiendaHielo');
      var selProv = document.getElementById('selProveedorHielo');
      document.getElementById('contenedorHielo').innerHTML = '';
      if (sel.value === '' || !datosHielo) {
        selProv.innerHTML = '<option value="">Primero elige tu tienda</option>';
        selProv.disabled = true;
        return;
      }
      var tienda = datosHielo[Number(sel.value)];
      selProv.innerHTML = '<option value="">— Elige el proveedor —</option>' + tienda.proveedores.map(function (p, i) {
        return '<option value="' + i + '">' + escaparHtml(p.proveedor + ' (' + textoAbiertas(p.totalAbiertas) + ')') + '</option>';
      }).join('');
      selProv.disabled = false;
      var idx = tienda.proveedores.findIndex(function (p) { return p.proveedor === provPrevio; });
      if (idx >= 0) { selProv.value = idx; mostrarOrdenesHielo(); }
    }

    function diasDesde(fechaYmd) {
      var f = new Date(fechaYmd.replace(' ', 'T'));
      var dias = Math.floor((Date.now() - f.getTime()) / 86400000);
      return dias <= 0 ? 'hoy' : dias === 1 ? 'hace 1 día' : 'hace ' + dias + ' días';
    }

    function mostrarOrdenesHielo() {
      var sel = document.getElementById('selTiendaHielo');
      var selProv = document.getElementById('selProveedorHielo');
      var cont = document.getElementById('contenedorHielo');
      cont.innerHTML = '';
      if (sel.value === '' || selProv.value === '' || !datosHielo) return;
      var tienda = datosHielo[Number(sel.value)];
      var prov = tienda.proveedores[Number(selProv.value)];

      if (!prov.ordenes.length) {
        cont.innerHTML = '<div class="bg-amber-950/40 border border-amber-800/60 p-4 rounded-xl text-amber-300 text-sm font-medium text-center shadow-lg">' +
          '⚠️ <span class="font-bold">' + escaparHtml(tienda.tienda) + '</span> no tiene órdenes abiertas de <span class="font-bold">' + escaparHtml(prov.proveedor) + '</span>.<br>' +
          '<span class="text-xs opacity-80 font-normal">Comunícate con la <span class="font-semibold text-white">Torre de Control</span> antes de ingresar hielo.</span></div>';
        return;
      }

      prov.ordenes.forEach(function (o, i) {
        var n = i + 1;
        var pendiente = Math.max(0, (Number(o.cantidadSolicitada) || 0) - (Number(o.cantidadRecibida) || 0));
        var partes = (o.fechaCreacionMx || '').split(' ');
        var ymd = (partes[0] || '').split('-');
        var fechaTxt = ymd.length === 3 ? ymd[2] + '/' + ymd[1] + '/' + ymd[0] + ' ' + (partes[1] || '') : 'N/A';
        var esPrimera = n === 1;
        var borde = esPrimera ? 'border-cyan-500/80 shadow-cyan-950/30' : 'border-slate-700';
        var etiqueta = esPrimera
          ? '<span class="bg-cyan-500/20 text-cyan-300 border border-cyan-500/50 px-2 py-0.5 rounded text-[10px] font-extrabold uppercase tracking-widest">#1 · Ingresar primero</span>'
          : '<span class="bg-slate-700/60 text-slate-300 border border-slate-600 px-2 py-0.5 rounded text-[10px] font-extrabold uppercase tracking-widest">#2 · Siguiente</span>';
        var extId = o.externalId
          ? '<div class="flex justify-between items-end border-b border-slate-700/60 pb-3">' +
              '<div><span class="text-[10px] font-semibold text-slate-400 block uppercase tracking-wider">External ID (albarán / OC)</span>' +
              '<span class="text-base font-bold font-mono text-blue-300">' + escaparHtml(o.externalId) + '</span></div>' +
              '<button onclick="copiarIdNitroCualquiera(\'' + escaparHtml(o.externalId) + '\', \'btnHieloExt_' + i + '\', \'txtHieloExt_' + i + '\')" id="btnHieloExt_' + i + '" class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-3 py-1.5 rounded-lg border border-slate-600 text-xs font-semibold tracking-wide transition-all active:scale-95 flex items-center gap-1.5"><span id="txtHieloExt_' + i + '">Copiar</span></button>' +
            '</div>'
          : '';

        cont.innerHTML +=
          '<div class="bg-[#1e293b] rounded-2xl shadow-2xl border ' + borde + ' overflow-hidden">' +
            '<div class="bg-[#0f172a] px-6 py-4 border-b border-slate-700/80 flex justify-between items-center gap-2">' +
              '<div>' + etiqueta + '<div class="text-sm font-bold text-white mt-1.5">' + escaparHtml(prov.proveedor) + '</div></div>' +
              '<div class="text-right">' +
                '<span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-amber-500/10 text-amber-400 border border-amber-500/30">' + escaparHtml(o.estadoPo) + '</span>' +
                '<div class="text-[10px] font-mono text-slate-400 mt-1.5">' + escaparHtml(fechaTxt) + ' · ' + diasDesde(o.fechaCreacionMx) + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="p-6 grid grid-cols-1 gap-4">' +
              '<div class="flex justify-between items-end border-b border-slate-700/60 pb-3">' +
                '<div><span class="text-[10px] font-semibold text-emerald-400 block uppercase tracking-wider">ID Nitro (PO_ID)</span>' +
                '<span class="text-2xl font-extrabold font-mono tracking-wide text-emerald-400 drop-shadow-[0_0_6px_rgba(16,185,129,0.2)]">' + escaparHtml(o.idNitro) + '</span></div>' +
                '<button onclick="copiarIdNitroCualquiera(\'' + escaparHtml(o.idNitro) + '\', \'btnHielo_' + i + '\', \'txtHielo_' + i + '\')" id="btnHielo_' + i + '" class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-3 py-1.5 rounded-lg border border-slate-600 text-xs font-semibold tracking-wide transition-all active:scale-95 flex items-center gap-1.5"><span id="txtHielo_' + i + '">Copiar</span></button>' +
              '</div>' +
              extId +
              '<div class="text-xs text-slate-300"><span class="text-[10px] font-semibold text-slate-400 block uppercase tracking-wider mb-0.5">Producto</span>' + escaparHtml(o.productos) + '</div>' +
              '<div class="grid grid-cols-3 gap-3">' +
                '<div class="bg-[#0f172a]/60 p-3 rounded-xl border border-blue-900/30"><span class="text-[10px] font-semibold text-blue-400 block uppercase tracking-wider">Solicitada</span><span class="text-lg font-extrabold text-blue-300">' + escaparHtml(o.cantidadSolicitada) + '</span></div>' +
                '<div class="bg-[#0f172a]/60 p-3 rounded-xl border border-emerald-900/30"><span class="text-[10px] font-semibold text-emerald-400 block uppercase tracking-wider">Recibida</span><span class="text-lg font-extrabold text-emerald-300">' + escaparHtml(o.cantidadRecibida) + '</span></div>' +
                '<div class="bg-[#0f172a]/60 p-3 rounded-xl border border-cyan-900/40"><span class="text-[10px] font-semibold text-cyan-400 block uppercase tracking-wider">Pendiente</span><span class="text-lg font-extrabold text-cyan-300">' + pendiente + '</span></div>' +
              '</div>' +
            '</div>' +
          '</div>';
      });

      if (prov.totalAbiertas > prov.ordenes.length) {
        cont.innerHTML += '<p class="text-[11px] text-slate-500 text-center">La tienda tiene ' + prov.totalAbiertas + ' órdenes abiertas de ' + escaparHtml(prov.proveedor) + '; se muestran las 2 más antiguas.</p>';
      }
    }

    function copiarIdNitroCualquiera(idValue, btnId, textId) {
      if (!idValue || idValue === "--") return;
      navigator.clipboard.writeText(idValue).then(function() {
        var btn = document.getElementById(btnId);
        var textSpace = document.getElementById(textId);
        // Guarda texto y clases originales (cada boton tiene los suyos: "Copiar", "Copiar SAP", "Copiar ID")
        if (!btn.dataset.textoOriginal) {
          btn.dataset.textoOriginal = textSpace.innerText;
          btn.dataset.clasesOriginales = btn.className;
        }
        textSpace.innerText = "✓ Copiado";
        btn.className = btn.dataset.clasesOriginales
          .replace(/bg-slate-800|hover:bg-slate-700|text-slate-300|hover:text-white|border-slate-600|active:scale-95/g, "")
          + " bg-emerald-950 text-emerald-400 border-emerald-500/40";
        clearTimeout(btn._timerCopiado);
        btn._timerCopiado = setTimeout(function() {
          textSpace.innerText = btn.dataset.textoOriginal;
          btn.className = btn.dataset.clasesOriginales;
        }, 2000);
      });
    }
  </script>
</body>
</html>
